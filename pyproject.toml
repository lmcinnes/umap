[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umap-learn"
version = "0.6.0"
description = "Uniform Manifold Approximation and Projection"
readme = "README.rst"
license = {text = "BSD"}
keywords = ["dimension reduction", "umap", "t-sne", "manifold"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "numpy >= 2.0",
    "scipy >= 1.13",
    "scikit-learn >= 1.6",
    "numba >= 0.60",
    "pynndescent >= 0.7",
    "tqdm",
]

[[project.maintainers]]
name = "Leland McInnes"
email = "leland.mcinnes@gmail.com"

[project.urls]
Homepage = "http://github.com/lmcinnes/umap"
Repository = "http://github.com/lmcinnes/umap"

[project.optional-dependencies]
plot = [
    "pandas",
    "matplotlib",
    "datashader",
    "bokeh",
    "holoviews",
    "colorcet",
    "seaborn",
    "scikit-image",
    "dask",
]
parametric_umap = ["tensorflow >= 2.1"]
tbb = ["tbb >= 2019.0"]
rinnd = ["rinnd >= 0.3.1"]
test = ["pytest"]

[dependency-groups]
cicd = ["pytest", "pytest-azurepipelines", "pytest-cov", "pytest-benchmark"]

[tool.setuptools]
packages = ["umap"]
zip-safe = false

[tool.setuptools.package-data]
"*" = ["*.pyx", "*.pxd"]
"umap" = ["py.typed"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "benchmark: performance benchmarks (skipped by default)",
]
