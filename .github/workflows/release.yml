name: "Publish release to PyPI"

on:
  push:
    tags:
      # Publish on version tags, e.g. release-0.1.0
      - "release-[0-9]+.[0-9]+.[0-9]+"
      - "release-[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "release-[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  tests:
    uses: ./.github/workflows/run-tests.yml
    permissions:
      contents: read

  build:
    needs:
      - tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build
        run: uv build

      - name: Check tag matches package version
        run: |
          # Strip leading fields to get version number
          TAG_VERSION="${GITHUB_REF_NAME#release-}"
          PACKAGE_VERSION="$(uv version --short)"
          
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version in git tag is ${TAG_VERSION} but package has version ${PACKAGE_VERSION}!"
            exit 1
          fi

      # Check that basic imports work
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl umap/tests/smoke_test.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz umap/tests/smoke_test.py

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish
        # Real PyPI
        run: uv publish --trusted-publishing always
        # TestPyPI
        # run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always
